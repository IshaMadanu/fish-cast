[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishcast"
version = "0.2.0"
description = "Forecasting Antarctic krill distribution relative to CCAMLR marine protected areas"
requires-python = ">=3.9"

[project.optional-dependencies]
chatbot = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "uvicorn==0.34.0",
    "streamlit==1.55.0",
    "xai-sdk==1.21.0",
]

[tool.setuptools.packages.find]
include = ["fishcast*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
