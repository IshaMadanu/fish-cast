# From the repository root:
#   docker compose --env-file viz/chatbot/.env -f viz/chatbot/docker-compose.yml up --build
# The API image does not install PyTorch. Build context is viz/.

services:
  api:
    build:
      context: ..
      dockerfile: chatbot/Dockerfile
    image: fishcast-policy-chatbot
    ports:
      - "8000:8000"
    environment:
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_COLLECTION_ID: ${XAI_COLLECTION_ID:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.7}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-high}
      XAI_TIMEOUT_SECONDS: ${XAI_TIMEOUT_SECONDS:-180}
      FISHCAST_COLLECTION_VERSION: ${FISHCAST_COLLECTION_VERSION:-}
      CHATBOT_ENABLE_WEB_SEARCH: ${CHATBOT_ENABLE_WEB_SEARCH:-false}
      CHATBOT_SEARCH_LIMIT: ${CHATBOT_SEARCH_LIMIT:-8}
      CHATBOT_BASIC_AUTH_USER: ${CHATBOT_BASIC_AUTH_USER:-}
      CHATBOT_BASIC_AUTH_PASSWORD: ${CHATBOT_BASIC_AUTH_PASSWORD:-}
      CHATBOT_RATE_LIMIT_PER_MINUTE: ${CHATBOT_RATE_LIMIT_PER_MINUTE:-30}
      CHATBOT_AUDIT_LOG: /tmp/chatbot-audit.jsonl
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ..
      dockerfile: chatbot/Dockerfile
    image: fishcast-policy-chatbot
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      CHATBOT_API_URL: http://api:8000
      CHATBOT_BASIC_AUTH_USER: ${CHATBOT_BASIC_AUTH_USER:-}
      CHATBOT_BASIC_AUTH_PASSWORD: ${CHATBOT_BASIC_AUTH_PASSWORD:-}
    command:
      [
        "streamlit",
        "run",
        "viz/chatbot/ui.py",
        "--server.port",
        "8501",
        "--server.address",
        "0.0.0.0",
      ]
