<!doctype html>
<!--
  South-polar map prototype (Data Viz week 1 starter).

  Run from the repository root (stop any old static server with Ctrl+C first):
      python scripts/data/convert_mpa_to_wgs84.py      # once, makes data/CCAMLR_MPA_wgs84.geojson
      python scripts/chat_server.py                    # set XAI_API_KEY in this terminal first
  then open http://localhost:8000/viz/prototype/polar_map.html

  Shows: land (Natural Earth via world-atlas), CCAMLR marine protected areas, and a sample
  of KRILLBASE hauls coloured by catch. Things to try next: switch the projection below,
  add CCAMLR subarea boundaries, add bathymetry, make the sample size a control.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishCast polar map prototype</title>
<style>
  :root { --ocean: #eef4f7; --land: #c9cfc4; --line: #8a9aa4; --mpa: #2f7d3a; --ink: #0f2a38; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: #fff; }
  header { padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0; color: #4a5c66; }
  #map { width: 100%; max-width: 860px; display: block; margin: 0 auto; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding: 8px 16px 16px; font-size: 12px; }
  .swatch { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; border-radius: 2px; }
  #status { color: #b05000; }
  #chat {
    position: fixed; right: 18px; bottom: 18px; z-index: 2; width: min(360px, calc(100vw - 36px));
    background: white; border: 1px solid #cbd6dc; border-radius: 12px; box-shadow: 0 4px 20px #0f2a3826;
    overflow: hidden;
  }
  #chat h2 { margin: 0; padding: 12px 14px; background: #0f2a38; color: white; font-size: 15px; }
  #chat-status { padding: 8px 12px 0; color: #5b6870; font-size: 12px; }
  #chat-messages { height: 220px; overflow-y: auto; padding: 10px 12px; }
  .chat-message { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chat-message strong { display: block; font-size: 12px; }
  #chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e1e7ea; }
  #chat-question { min-width: 0; flex: 1; padding: 8px; border: 1px solid #b9c5cb; border-radius: 6px; font: inherit; }
  #chat-form button { padding: 8px 12px; border: 0; border-radius: 6px; background: #176b84; color: white; font: inherit; }
  #chat-form button:disabled, #chat-question:disabled { opacity: .55; }
  @media (max-width: 500px) { #chat { right: 10px; bottom: 10px; width: calc(100vw - 20px); } }
</style>
</head>
<body>
<header>
  <h1>Southern Ocean: protected areas and KRILLBASE hauls</h1>
  <p>South-polar azimuthal equal-area projection. <span id="status"></span></p>
</header>
<svg id="map" viewBox="0 0 860 860" role="img" aria-label="Map of Antarctica with marine protected areas and krill haul locations"></svg>
<div class="legend" id="legend"></div>
<aside id="chat" aria-label="FishCast historical haul data chat">
  <h2>Ask about historical haul data</h2>
  <div id="chat-status" role="status">Checking for haul data and Grok configuration...</div>
  <div id="chat-messages" aria-live="polite">
    <p class="chat-message"><strong>FishCast</strong>Ask about historical krill haul observations and the environmental data recorded with them.</p>
  </div>
  <form id="chat-form">
    <input id="chat-question" type="text" maxlength="2000" placeholder="Ask about historical krill hauls..." aria-label="Your question" required>
    <button id="chat-send" type="submit">Send</button>
  </form>
</aside>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const SIZE = 860, SAMPLE = 500;
const DATA = "../../data/";
const chatForm = document.getElementById("chat-form");
const chatQuestion = document.getElementById("chat-question");
const chatSend = document.getElementById("chat-send");
const chatStatus = document.getElementById("chat-status");
const chatMessages = document.getElementById("chat-messages");
chatQuestion.disabled = true;
chatSend.disabled = true;

function addChatMessage(speaker, message) {
  const paragraph = document.createElement("p");
  paragraph.className = "chat-message";
  const label = document.createElement("strong");
  label.textContent = speaker;
  paragraph.append(label, document.createTextNode(message));
  chatMessages.append(paragraph);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function checkChatStatus() {
  try {
    const response = await fetch("/api/status");
    const status = await response.json();
    if (status.ready) {
      chatStatus.textContent = `Using historical haul data: ${status.historical_file}`;
      chatQuestion.disabled = false;
      chatSend.disabled = false;
    } else {
      const missing = [];
      if (!status.historical_file) missing.push("data/krillcast_merged.csv");
      if (!status.has_api_key) missing.push("XAI_API_KEY on the server");
      chatStatus.textContent = `Chat needs ${missing.join(" and ")}.`;
    }
  } catch {
    chatStatus.textContent = "Chat server unavailable. Start scripts/chat_server.py to enable chat.";
  }
}

chatForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const question = chatQuestion.value.trim();
  if (!question) return;
  addChatMessage("You", question);
  chatQuestion.value = "";
  chatQuestion.disabled = true;
  chatSend.disabled = true;
  chatStatus.textContent = "Checking historical haul data and asking Grok...";
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `Chat request failed (${response.status}).`);
    addChatMessage("FishCast", result.answer);
    chatStatus.textContent = `Answered using historical data: ${result.source_file}`;
  } catch (error) {
    addChatMessage("FishCast", error.message);
    chatStatus.textContent = "Could not answer that question.";
  } finally {
    await checkChatStatus();
  }
});

// Change this line to compare projections. Both are centred on the South Pole.
const projection = d3.geoAzimuthalEqualArea()          // or d3.geoStereographic()
  .rotate([0, 90])                                     // put the South Pole at the centre
  .clipAngle(55)                                       // show everything south of ~35 S
  .fitExtent([[10, 10], [SIZE - 10, SIZE - 10]], { type: "Sphere" });
const path = d3.geoPath(projection);
const svg = d3.select("#map");

// GeoJSON from most tools winds polygons counter-clockwise; D3 expects the opposite and
// would otherwise fill the whole globe. Reverse any ring that covers more than a hemisphere.
function rewind(feature) {
  const g = feature.geometry;
  const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  for (const poly of polys) {
    for (const ring of poly) {
      if (d3.geoArea({ type: "Polygon", coordinates: [ring] }) > 2 * Math.PI) ring.reverse();
    }
  }
  return feature;
}

async function main() {
  svg.append("path").attr("d", path({ type: "Sphere" })).attr("fill", "var(--ocean)");
  svg.append("path").attr("d", path(d3.geoGraticule().step([30, 10])()))
    .attr("fill", "none").attr("stroke", "#d5e0e6").attr("stroke-width", 0.6);

  const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json");
  svg.append("path").attr("d", path(topojson.feature(world, world.objects.land)))
    .attr("fill", "var(--land)").attr("stroke", "#9aa59a").attr("stroke-width", 0.4);

  const status = document.getElementById("status");
  try {
    const mpa = await d3.json(DATA + "CCAMLR_MPA_wgs84.geojson");
    mpa.features.forEach(rewind);
    svg.append("g").selectAll("path").data(mpa.features).join("path")
      .attr("d", path).attr("fill", "var(--mpa)").attr("fill-opacity", 0.25)
      .attr("stroke", "var(--mpa)").attr("stroke-width", 1)
      .append("title").text(d => `${d.properties.GAR_Short_Label}: ${d.properties.GAR_Name}`);
  } catch (e) { status.textContent += " MPA file not found: run scripts/data/convert_mpa_to_wgs84.py."; }

  try {
    const rows = await d3.csv(DATA + "krillcast_merged.csv", d3.autoType);
    const sample = d3.shuffle(rows.slice()).slice(0, SAMPLE);
    const color = d3.scaleSequentialLog(d3.interpolateViridis)
      .domain([1, d3.max(sample, d => d.NUMBER_OF_KRILL_UNDER_1M2) || 1000]);
    svg.append("g").selectAll("circle").data(sample).join("circle")
      .attr("transform", d => `translate(${projection([d.LONGITUDE, d.LATITUDE])})`)
      .attr("r", 2.6)
      .attr("fill", d => d.NUMBER_OF_KRILL_UNDER_1M2 > 0 ? color(d.NUMBER_OF_KRILL_UNDER_1M2) : "#ffffff")
      .attr("stroke", "#33424a").attr("stroke-width", 0.4)
      .append("title").text(d => `${d.DATE}: ${d.NUMBER_OF_KRILL_UNDER_1M2} krill per m²`);
  } catch (e) { status.textContent += " Haul file not found: put krillcast_merged.csv in data/."; }

  document.getElementById("legend").innerHTML =
    '<span><span class="swatch" style="background:var(--mpa);opacity:.5"></span>Marine protected area</span>' +
    '<span><span class="swatch" style="background:#fff;border:1px solid #33424a"></span>Haul, no krill</span>' +
    '<span><span class="swatch" style="width:48px;background:linear-gradient(90deg,' + d3.interpolateViridis(0.1) + ',' + d3.interpolateViridis(0.5) + ',' + d3.interpolateViridis(0.95) + ')"></span>Haul, fewer to more krill (log scale)</span>';
}
checkChatStatus();
main();
</script>
</body>
</html>
